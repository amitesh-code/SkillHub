
# Application
spring.application.name=SkillHub

# Test database: PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:8090/skillhub_test
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT: test-only signing secret
jwt.secret=${TEST_JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Initial Super Admin: test-only password
skillhub.admin.email=${SKILLHUB_ADMIN_EMAIL}
skillhub.admin.password=${SKILLHUB_ADMIN_PASSOWRD}


# Logging
logging.level.org.springframework.security=TRACE
